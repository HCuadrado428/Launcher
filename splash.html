<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ember Launcher</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }
    .splash {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'Segoe UI', Inter, sans-serif;
        background: #101216;
        border-radius: 12px;
        border: 1px solid #262b33;
        -webkit-user-select: none;
    }
    .splash-icon {
        width: 64px;
        height: 64px;
    }
    .splash-title {
        font-family: 'Segoe UI', Inter, sans-serif;
        font-weight: 700;
        font-size: 14px;
        color: #e8eaed;
        letter-spacing: .3px;
    }
    .splash-dots {
        display: flex;
        gap: 6px;
    }
    .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff8a3d;
        opacity: .3;
        animation: dot-blink 1.2s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: .2s; }
    .splash-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-blink {
        0%, 80%, 100% { opacity: .25; }
        40% { opacity: 1; }
    }
</style>
</head>
<body>
    <div class="splash">
        <img class="splash-icon" src="build/icon.png" alt="">
        <div class="splash-title">EMBER LAUNCHER</div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
</body>
</html>
